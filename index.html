      { value: "Lush Greenery Only, No People", label: "เน้นต้นไม้และสวนร่มรื่น ไม่มีคน (Nature Only)" },
      { value: "Minimalist Clean, Focus Purely on Architecture", label: "โล่งสะอาด เน้นตัวอาคารเพียวๆ (Minimal / Empty)" }
    ];

    function App() {
      // Mode: 'parameter' (Text-to-Render) or 'sketch' (Sketch-to-Render)
      const [mode, setMode] = useState('parameter');

      // Engine & API Key State
      const [renderEngineMode, setRenderEngineMode] = useState('free'); // 'free' (Pollinations) or 'gemini'
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_arch_api_key') || '');
      const [showApiModal, setShowApiModal] = useState(false);
      const [tempApiKey, setTempApiKey] = useState(apiKey);
      const [aspectRatio, setAspectRatio] = useState('16:9');

      // Sketch Upload State
      const [sketchImage, setSketchImage] = useState(null);
      const [sketchBase64, setSketchBase64] = useState(null);
      const [sketchMimeType, setSketchMimeType] = useState('image/png');

      // Parameters State
      const [buildingType, setBuildingType] = useState(BUILDING_TYPES[0].value);
      const [numFloors, setNumFloors] = useState(2);
      const [styleCategory, setStyleCategory] = useState('architect'); // 'architect' or 'general'
      const [selectedArchitectId, setSelectedArchitectId] = useState(10); // Default: Tadao Ando
      const [architectSearch, setArchitectSearch] = useState('');
      const [generalStyle, setGeneralStyle] = useState(GENERAL_STYLES[0].value);
      
      const [timeOfDay, setTimeOfDay] = useState(TIMES_OF_DAY[2].value); // Golden Hour
      const [weather, setWeather] = useState(WEATHERS[0].value);
      const [cameraAngle, setCameraAngle] = useState(CAMERA_ANGLES[0].value);
      const [material, setMaterial] = useState(MATERIALS[0].value);
      const [environment, setEnvironment] = useState(ENVIRONMENTS[1].value);
      const [lighting, setLighting] = useState(LIGHTING_SETUPS[1].value);
      const [renderStyle, setRenderStyle] = useState(RENDER_STYLES[0].value);
      const [entourage, setEntourage] = useState(ENTOURAGES[0].value);
      const [sketchAdherence, setSketchAdherence] = useState(85);

      // Rendering & Output State
      const [isRendering, setIsRendering] = useState(false);
      const [renderedImage, setRenderedImage] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');
      const [generatedPrompt, setGeneratedPrompt] = useState('');
      const [sliderPos, setSliderPos] = useState(50);
      const [showPromptBox, setShowPromptBox] = useState(false);

      const fileInputRef = useRef(null);

      // Selected Architect Object
      const currentArchitect = ARCHITECTS_100.find(a => a.id === Number(selectedArchitectId)) || ARCHITECTS_100[0];

      // Filtered Architects for Search
      const filteredArchitects = ARCHITECTS_100.filter(a => 
        a.name.toLowerCase().includes(architectSearch.toLowerCase()) ||
        a.desc.toLowerCase().includes(architectSearch.toLowerCase())
      );

      // Save API Key
      const handleSaveApiKey = () => {
        const trimmed = tempApiKey.trim();
        setApiKey(trimmed);
        localStorage.setItem('gemini_arch_api_key', trimmed);
        setShowApiModal(false);
      };

      // Handle Image File Upload
      const processFile = (file) => {
        if (!file || !file.type.startsWith('image/')) {
          setErrorMsg('กรุณาอัปโหลดไฟล์รูปภาพเท่านั้น (JPG, PNG, WEBP)');
          return;
        }
        setErrorMsg('');
        setSketchMimeType(file.type);
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          setSketchImage(dataUrl);
          const base64Data = dataUrl.split(',')[1];
          setSketchBase64(base64Data);
          setRenderedImage(null);
        };
        reader.readAsDataURL(file);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        processFile(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        processFile(file);
      };

      // Construct Prompt
      const buildArchitecturalPrompt = () => {
        const designApproach = styleCategory === 'architect'
          ? `designed in the signature architectural style and design philosophy of architect ${currentArchitect.name} (${currentArchitect.desc})`
          : `designed in ${generalStyle} architectural style`;

        const baseSpec = `Architectural visualization of a ${numFloors}-story ${buildingType}, ${designApproach}.`;
        const detailsSpec = `Primary facade material: ${material}. Environment and surroundings: ${environment}. Camera perspective: ${cameraAngle}. Time of day: ${timeOfDay}. Weather atmosphere: ${weather}. Lighting setup: ${lighting}. Entourage and landscaping: ${entourage}. Render output style: ${renderStyle}, 8k resolution, ultra-detailed architectural photography, realistic textures, accurate proportions.`;

        if (mode === 'sketch') {
          let adherenceText = '';
          if (sketchAdherence >= 80) {
            adherenceText = 'Strictly preserve the exact building geometry, massing, perspective lines, window placements, and structural proportions from the attached architectural sketch.';
          } else if (sketchAdherence >= 50) {
            adherenceText = 'Follow the overall building massing and composition of the attached sketch while refining architectural details and proportions.';
          } else {
            adherenceText = 'Use the attached sketch as a loose compositional inspiration while creatively reinterpreting the architectural form.';
          }
          return `Transform this architectural sketch into a realistic architectural render. ${adherenceText} ${baseSpec} ${detailsSpec}`;
        } else {
          return `${baseSpec} ${detailsSpec}`;
        }
      };

      // Execute Render (Free Mode via Pollinations.ai OR Paid Gemini API)
      const handleGenerateRender = async () => {
        if (renderEngineMode === 'gemini' && !apiKey) {
          setShowApiModal(true);
          return;
        }
        if (mode === 'sketch' && !sketchBase64) {
          setErrorMsg('กรุณาอัปโหลดภาพสเก็ตช์ก่อนกดเรนเดอร์ หรือสลับไปใช้โหมด "สร้างจากพารามิเตอร์ล้วน"');
          return;
        }

        setIsRendering(true);
        setErrorMsg('');
        const promptText = buildArchitecturalPrompt();
        setGeneratedPrompt(promptText);

        try {
          if (renderEngineMode === 'free') {
            // Free Unlimited Image Generation via Pollinations.ai (Flux Architectural Engine)
            let width = 1280;
            let height = 720;
            if (aspectRatio === '4:3') { width = 1024; height = 768; }
            else if (aspectRatio === '1:1') { width = 1024; height = 1024; }
            else if (aspectRatio === '9:16') { width = 720; height = 1280; }

            const seed = Math.floor(Math.random() * 1000000);
            const encodedPrompt = encodeURIComponent(promptText);
            const freeUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&model=flux&nologo=true`;

            // Fetch image as blob so download button & canvas work seamlessly without CORS issues
            const imgResponse = await fetch(freeUrl);
            if (!imgResponse.ok) {
              throw new Error('เซิร์ฟเวอร์สร้างภาพฟรีกำลังหนาแน่น กรุณากดสร้างภาพใหม่อีกครั้ง');
            }
            const blob = await imgResponse.blob();
            const reader = new FileReader();
            reader.onloadend = () => {
              setRenderedImage(reader.result);
              setIsRendering(false);
            };
            reader.onerror = () => {
              // Fallback to direct URL if FileReader fails
              setRenderedImage(freeUrl);
              setIsRendering(false);
            };
            reader.readAsDataURL(blob);
            return;
          } else {
            // Paid Gemini API (Requires Billing Enabled on Google AI Studio)
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${apiKey}`;
            
            const parts = [{ text: promptText }];
            if (mode === 'sketch' && sketchBase64) {
              parts.push({
                inlineData: {
                  mimeType: sketchMimeType,
                  data: sketchBase64
                }
              });
            }

            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts }],
                generationConfig: {
                  responseModalities: ["IMAGE"]
                }
              })
            });

            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.error?.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อ API กรุณาตรวจสอบ API Key ของคุณ');
            }

            const candidateParts = data.candidates?.[0]?.content?.parts || [];
            const imagePart = candidateParts.find(p => p.inlineData && p.inlineData.data);

            if (imagePart) {
              const outMime = imagePart.inlineData.mimeType || 'image/png';
              setRenderedImage(`data:${outMime};base64,${imagePart.inlineData.data}`);
            } else {
              throw new Error('โมเดลไม่ได้ส่งคืนรูปภาพ กรุณาลองปรับพารามิเตอร์หรือกดเรนเดอร์ใหม่อีกครั้ง');
            }
            setIsRendering(false);
          }
        } catch (err) {
          setErrorMsg(err.message || 'เกิดข้อผิดพลาดระหว่างการสร้างภาพ');
          setIsRendering(false);
        }
      };

      const handleDownload = () => {
        if (!renderedImage) return;
        const link = document.createElement('a');
        link.href = renderedImage;
        const archSlug = styleCategory === 'architect' ? currentArchitect.name.replace(/\s+/g, '_') : generalStyle.replace(/\s+/g, '_');
        link.download = `ArchRender_${numFloors}F_${archSlug}_${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Top Navigation Bar */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-30">
            <div className="max-w-[1600px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-lg shadow-amber-500/20">
                  <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                  </svg>
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-tight text-white flex items-center gap-2">
                    ArchRender AI Studio
                    <span className="text-[11px] font-medium px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
                      100 Architects Edition
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400 hidden sm:block">ระบบสร้างภาพเรนเดอร์สถาปัตยกรรมจากพารามิเตอร์และภาพสเก็ตช์</p>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <div className="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800">
                  <button
                    onClick={() => setRenderEngineMode('free')}
                    className={`px-2.5 py-1.5 rounded-md text-xs font-semibold transition-all ${
                      renderEngineMode === 'free'
                        ? 'bg-emerald-500 text-slate-950 shadow'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    โหมดฟรี (ไม่จำกัด)
                  </button>
                  <button
                    onClick={() => setRenderEngineMode('gemini')}
                    className={`px-2.5 py-1.5 rounded-md text-xs font-semibold transition-all ${
                      renderEngineMode === 'gemini'
                        ? 'bg-amber-500 text-slate-950 shadow'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Gemini API
                  </button>
                </div>

                {renderEngineMode === 'gemini' && (
                  <button
                    onClick={() => {
                      setTempApiKey(apiKey);
                      setShowApiModal(true);
                    }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 border transition-all ${
                      apiKey 
                        ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20' 
                        : 'bg-rose-500/10 text-rose-400 border-rose-500/30 hover:bg-rose-500/20'
                    }`}
                  >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                    {apiKey ? 'API Key พร้อม' : 'ใส่ API Key'}
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Workspace */}
          <main className="flex-1 max-w-[1600px] w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* LEFT PANEL: Controls & Parameters (5 cols) */}
            <div className="lg:col-span-5 xl:col-span-4 flex flex-col gap-5 bg-slate-900/70 border border-slate-800 rounded-2xl p-5 h-fit lg:max-h-[calc(100vh-7rem)] lg:overflow-y-auto">
              
              {/* Mode Switcher */}
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                  รูปแบบการสร้างภาพ (Generation Mode)
                </label>
                <div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800">
                  <button
                    type="button"
                    onClick={() => setMode('parameter')}
                    className={`py-2.5 px-3 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 ${
                      mode === 'parameter'
                        ? 'bg-amber-500 text-slate-950 shadow-md'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                    พารามิเตอร์ล้วน
                  </button>
                  <button
                    type="button"
                    onClick={() => setMode('sketch')}
                    className={`py-2.5 px-3 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1.5 ${
                      mode === 'sketch'
                        ? 'bg-amber-500 text-slate-950 shadow-md'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    ใช้ภาพสเก็ตช์ (เสริม)
                  </button>
                </div>
              </div>

              {/* Optional Sketch Upload Box */}
              {mode === 'sketch' && (
                <div className="p-4 rounded-xl bg-slate-950/80 border border-slate-800 space-y-3">
                  {renderEngineMode === 'free' && (
                    <div className="p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/30 text-[11px] text-amber-300 leading-relaxed">
                      <strong>หมายเหตุโหมดฟรี:</strong> โมเดลฟรีจะเน้นสร้างภาพจากคำบรรยายพารามิเตอร์เป็นหลัก หากต้องการให้ระบบอ่านเส้นสเก็ตช์ต้นฉบับแบบแม่นยำ แนะนำให้สลับไปใช้ <strong>Gemini API</strong> ด้านบนครับ
                    </div>
                  )}
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-semibold text-amber-400">อัปโหลดภาพสเก็ตช์ต้นฉบับ</span>
                    {sketchImage && (
                      <button
                        onClick={() => { setSketchImage(null); setSketchBase64(null); setRenderedImage(null); }}
                        className="text-xs text-rose-400 hover:underline"
                      >
                        ลบภาพ
                      </button>
                    )}
                  </div>
                  
                  {!sketchImage ? (
                    <div
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={handleDrop}
                      onClick={() => fileInputRef.current?.click()}
                      className="border-2 border-dashed border-slate-700 hover:border-amber-500/60 rounded-xl p-6 text-center cursor-pointer transition-colors bg-slate-900/40"
                    >
                      <svg className="w-8 h-8 mx-auto text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                      </svg>
                      <p className="text-xs font-medium text-slate-300">คลิกเพื่อเลือกไฟล์ หรือลากภาพสเก็ตช์มาวางที่นี่</p>
                      <p className="text-[11px] text-slate-500 mt-1">รองรับ JPG, PNG, WEBP</p>
                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        onChange={handleFileUpload}
                        className="hidden"
                      />
                    </div>
                  ) : (
                    <div className="relative rounded-lg overflow-hidden border border-slate-700 bg-slate-900">
                      <img src={sketchImage} alt="Uploaded Sketch" className="w-full h-36 object-contain" />
                    </div>
                  )}

                  {/* Parameter 10: Sketch Adherence */}
                  <div className="pt-2">
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-slate-300 font-medium">ความเข้มงวดในการยึดตามเส้นสเก็ตช์</span>
                      <span className="text-amber-400 font-bold">{sketchAdherence}%</span>
                    </div>
                    <input
                      type="range"
                      min="20"
                      max="100"
                      step="5"
                      value={sketchAdherence}
                      onChange={(e) => setSketchAdherence(Number(e.target.value))}
                      className="w-full accent-amber-500 cursor-pointer"
                    />
                  </div>
                </div>
              )}

              <hr className="border-slate-800" />

              {/* PARAMETERS SECTION */}
              <div className="space-y-4">
                
                {/* Param 1: Building Type */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                    1. ประเภทของอาคาร (Building Type)
                  </label>
                  <select
                    value={buildingType}
                    onChange={(e) => setBuildingType(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    {BUILDING_TYPES.map((item) => (
                      <option key={item.value} value={item.value}>{item.label}</option>
                    ))}
                  </select>
                </div>

                {/* Param 2: Number of Floors (1-20) */}
                <div>
                  <div className="flex justify-between items-center mb-1.5">
                    <label className="text-xs font-semibold text-slate-300">
                      2. จำนวนชั้น (Number of Floors)
                    </label>
                    <span className="px-2.5 py-0.5 rounded-md bg-amber-500/20 text-amber-400 text-xs font-bold border border-amber-500/30">
                      {numFloors} ชั้น
                    </span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="20"
                    value={numFloors}
                    onChange={(e) => setNumFloors(Number(e.target.value))}
                    className="w-full accent-amber-500 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-slate-500 mt-0.5">
                    <span>1 ชั้น</span>
                    <span>5 ชั้น</span>
                    <span>10 ชั้น</span>
                    <span>15 ชั้น</span>
                    <span>20 ชั้น</span>
                  </div>
                </div>

                {/* Param 3: Architectural Style & 100 Architects Approach */}
                <div className="p-3.5 rounded-xl bg-slate-950/90 border border-slate-800 space-y-3">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-semibold text-slate-200">
                      3. สไตล์ & แนวทางการออกแบบสถาปนิก
                    </label>
                  </div>

                  {/* Sub-tabs: 100 Architects vs General Styles */}
                  <div className="grid grid-cols-2 gap-1.5 bg-slate-900 p-1 rounded-lg border border-slate-800">
                    <button
                      type="button"
                      onClick={() => setStyleCategory('architect')}
                      className={`py-1.5 px-2 rounded-md text-xs font-medium transition-all ${
                        styleCategory === 'architect'
                          ? 'bg-slate-700 text-amber-400 shadow'
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      100 สถาปนิกชื่อดัง
                    </button>
                    <button
                      type="button"
                      onClick={() => setStyleCategory('general')}
                      className={`py-1.5 px-2 rounded-md text-xs font-medium transition-all ${
                        styleCategory === 'general'
                          ? 'bg-slate-700 text-amber-400 shadow'
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      สไตล์สถาปัตย์ทั่วไป
                    </button>
                  </div>

                  {styleCategory === 'architect' ? (
                    <div className="space-y-2">
                      {/* Quick Search Box for 100 Architects */}
                      <input
                        type="text"
                        placeholder="ค้นหาชื่อสถาปนิก (เช่น Tadao, Zaha, Bawa, Kuma)..."
                        value={architectSearch}
                        onChange={(e) => setArchitectSearch(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                      />
                      <select
                        value={selectedArchitectId}
                        onChange={(e) => setSelectedArchitectId(Number(e.target.value))}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                      >
                        {filteredArchitects.map((arch) => (
                          <option key={arch.id} value={arch.id}>
                            #{arch.id} {arch.name} ({arch.era})
                          </option>
                        ))}
                      </select>
                      {/* Architect Description Card */}
                      <div className="p-2.5 rounded-lg bg-amber-500/5 border border-amber-500/20 text-xs text-slate-300 leading-relaxed">
                        <span className="font-semibold text-amber-400">{currentArchitect.name}: </span>
                        {currentArchitect.desc}
                      </div>
                    </div>
                  ) : (
                    <select
                      value={generalStyle}
                      onChange={(e) => setGeneralStyle(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                    >
                      {GENERAL_STYLES.map((st) => (
                        <option key={st.value} value={st.value}>{st.label}</option>
                      ))}
                    </select>
                  )}
                </div>

                {/* Param 4: Primary Material */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                    4. วัสดุหลักของอาคาร (Primary Material)
                  </label>
                  <select
                    value={material}
                    onChange={(e) => setMaterial(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    {MATERIALS.map((item) => (
                      <option key={item.value} value={item.value}>{item.label}</option>
                    ))}
                  </select>
                </div>

                {/* Param 5: Environment / Context */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                    5. สภาพแวดล้อมและบริบท (Environment & Context)
                  </label>
                  <select
                    value={environment}
                    onChange={(e) => setEnvironment(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    {ENVIRONMENTS.map((item) => (
                      <option key={item.value} value={item.value}>{item.label}</option>
                    ))}
                  </select>
                </div>

                {/* Param 6: Time of Day */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                    6. ช่วงเวลาของวัน (Time of Day)
                  </label>
                  <select
                    value={timeOfDay}
                    onChange={(e) => setTimeOfDay(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    {TIMES_OF_DAY.map((item) => (
                      <option key={item.value} value={item.value}>{item.label}</option>
                    ))}
                  </select>
                </div>

                {/* Param 7: Weather / Atmosphere */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                    7. สภาพอากาศ (Weather & Atmosphere)
                  </label>
                  <select
                    value={weather}
                    onChange={(e) => setWeather(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    {WEATHERS.map((item) => (
                      <option key={item.value} value={item.value}>{item.label}</option>
                    ))}
                  </select>
                </div>

                {/* Param 8: Camera Angle & Lens */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                    8. มุมมองกล้องและระยะเลนส์ (Camera Angle & Lens)
                  </label>
                  <select
                    value={cameraAngle}
                    onChange={(e) => setCameraAngle(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    {CAMERA_ANGLES.map((item) => (
                      <option key={item.value} value={item.value}>{item.label}</option>
                    ))}
                  </select>
                </div>

                {/* Param 9: Lighting Setup */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                    9. การจัดแสง (Lighting Setup)
                  </label>
                  <select
                    value={lighting}
                    onChange={(e) => setLighting(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  >
                    {LIGHTING_SETUPS.map((item) => (
                      <option key={item.value} value={item.value}>{item.label}</option>
                    ))}
                  </select>
                </div>

                {/* Param 10 & 11: Render Engine & Entourage */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                      10. สไตล์ภาพเรนเดอร์
                    </label>
                    <select
                      value={renderStyle}
                      onChange={(e) => setRenderStyle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
                    >
                      {RENDER_STYLES.map((item) => (
                        <option key={item.value} value={item.value}>{item.label}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                      11. องค์ประกอบเสริม
                    </label>
                    <select
                      value={entourage}
                      onChange={(e) => setEntourage(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
                    >
                      {ENTOURAGES.map((item) => (
                        <option key={item.value} value={item.value}>{item.label}</option>
                      ))}
                    </select>
                  </div>
                </div>

              </div>

              {/* Aspect Ratio Selector (For Free Mode) */}
              {renderEngineMode === 'free' && (
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                    สัดส่วนภาพ (Aspect Ratio)
                  </label>
                  <div className="grid grid-cols-4 gap-1.5">
                    {['16:9', '4:3', '1:1', '9:16'].map((ratio) => (
                      <button
                        key={ratio}
                        type="button"
                        onClick={() => setAspectRatio(ratio)}
                        className={`py-1.5 rounded-lg text-xs font-medium border transition-all ${
                          aspectRatio === ratio
                            ? 'bg-amber-500/20 border-amber-500 text-amber-400 font-bold'
                            : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                        }`}
                      >
                        {ratio}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Generate Button */}
              <div className="pt-2 sticky bottom-0 bg-slate-900 pb-1">
                <button
                  onClick={handleGenerateRender}
                  disabled={isRendering}
                  className="w-full py-3.5 px-6 rounded-xl font-bold text-sm text-slate-950 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-amber-500/25 transition-all flex items-center justify-center gap-2"
                >
                  {isRendering ? (
                    <>
                      <svg className="animate-spin h-5 w-5 text-slate-950" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none" />
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                      </svg>
                      กำลังประมวลผลเรนเดอร์สถาปัตยกรรม...
                    </>
                  ) : (
                    <>
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                      </svg>
                      สร้างภาพเรนเดอร์ (Generate Render)
                    </>
                  )}
                </button>
              </div>

            </div>

            {/* RIGHT PANEL: Viewport & Result (7 cols) */}
            <div className="lg:col-span-7 xl:col-span-8 flex flex-col gap-4">
              
              {/* Error Alert */}
              {errorMsg && (
                <div className="p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm flex items-start gap-3">
                  <svg className="w-5 h-5 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <div>
                    <p className="font-semibold">แจ้งเตือน</p>
                    <p className="text-xs mt-0.5">{errorMsg}</p>
                  </div>
                </div>
              )}

              {/* Main Canvas Box */}
              <div className="flex-1 min-h-[520px] bg-slate-900/60 border border-slate-800 rounded-2xl p-4 sm:p-6 flex flex-col justify-between relative overflow-hidden">
                
                {/* Top Status Bar inside Viewport */}
                <div className="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-800/80">
                  <div className="flex items-center gap-2 text-xs text-slate-400">
                    <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span>
                      สเปกปัจจุบัน: <strong className="text-slate-200">{numFloors} ชั้น</strong> •{' '}
                      <strong className="text-amber-400">
                        {styleCategory === 'architect' ? currentArchitect.name : generalStyle}
                      </strong>
                    </span>
                  </div>

                  <div className="flex items-center gap-2">
                    {generatedPrompt && (
                      <button
                        onClick={() => setShowPromptBox(!showPromptBox)}
                        className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 transition-colors"
                      >
                        {showPromptBox ? 'ซ่อน Prompt' : 'ดู Prompt ที่ใช้'}
                      </button>
                    )}
                    {renderedImage && (
                      <button
                        onClick={handleDownload}
                        className="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold text-white flex items-center gap-1.5 shadow transition-colors"
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        ดาวน์โหลดภาพเรนเดอร์
                      </button>
                    )}
                  </div>
                </div>

                {/* Collapsible Prompt Inspector */}
                {showPromptBox && generatedPrompt && (
                  <div className="my-3 p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-400 font-mono leading-relaxed">
                    <div className="text-[10px] uppercase tracking-wider text-amber-500 mb-1 font-sans font-bold">Generated AI Prompt:</div>
                    {generatedPrompt}
                  </div>
                )}

                {/* Viewport Display Area */}
                <div className="flex-1 flex items-center justify-center my-4 relative">
                  {isRendering ? (
                    <div className="text-center space-y-4 py-16">
                      <div className="w-16 h-16 border-4 border-amber-500/20 border-t-amber-500 rounded-full animate-spin mx-auto"></div>
                      <div>
                        <p className="text-base font-semibold text-white">กำลังเรนเดอร์สถาปัตยกรรม...</p>
                        <p className="text-xs text-slate-400 mt-1">
                          กำลังจำลองแสงเงา วัสดุ และสไตล์ของ {styleCategory === 'architect' ? currentArchitect.name : generalStyle}
                        </p>
                      </div>
                    </div>
                  ) : renderedImage ? (
                    mode === 'sketch' && sketchImage ? (
                      /* Before / After Comparison Slider for Sketch Mode */
                      <div className="w-full max-w-4xl mx-auto space-y-3">
                        <div className="relative w-full aspect-[16/10] rounded-xl overflow-hidden border border-slate-700 select-none bg-slate-950">
                          {/* After Image (Full) */}
                          <img
                            src={renderedImage}
                            alt="Rendered Result"
                            className="absolute inset-0 w-full h-full object-contain"
                          />
                          {/* Before Image (Clipped) */}
                          <div
                            className="absolute inset-0 overflow-hidden"
                            style={{ width: `${sliderPos}%` }}
                          >
                            <img
                              src={sketchImage}
                              alt="Original Sketch"
                              className="w-full h-full object-contain bg-slate-900"
                              style={{ width: '100%', maxWidth: 'none' }}
                            />
                          </div>
                          {/* Divider Line */}
                          <div
                            className="absolute top-0 bottom-0 w-0.5 bg-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.8)]"
                            style={{ left: `${sliderPos}%` }}
                          >
                            <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-amber-400 text-slate-950 flex items-center justify-center font-bold text-xs shadow-lg">
                              ↔
                            </div>
                          </div>
                          {/* Labels */}
                          <span className="absolute top-3 left-3 px-2.5 py-1 rounded bg-slate-950/80 text-[11px] font-semibold text-slate-200 border border-slate-700">
                            ภาพสเก็ตช์ (Before)
                          </span>
                          <span className="absolute top-3 right-3 px-2.5 py-1 rounded bg-amber-500/90 text-[11px] font-bold text-slate-950">
                            ภาพเรนเดอร์ (After)
                          </span>
                        </div>
                        <div className="flex items-center gap-3 px-2">
                          <span className="text-xs text-slate-400">เปรียบเทียบ Before / After:</span>
                          <input
                            type="range"
                            min="0"
                            max="100"
                            value={sliderPos}
                            onChange={(e) => setSliderPos(Number(e.target.value))}
                            className="flex-1 accent-amber-500 cursor-pointer"
                          />
                        </div>
                      </div>
                    ) : (
                      /* Pure Parameter Mode Render Display */
                      <div className="w-full max-w-4xl mx-auto">
                        <img
                          src={renderedImage}
                          alt="Generated Architectural Render"
                          className="w-full max-h-[68vh] object-contain rounded-xl border border-slate-700 shadow-2xl bg-slate-950"
                        />
                      </div>
                    )
                  ) : (
                    /* Empty Placeholder State */
                    <div className="text-center max-w-md mx-auto py-12 px-4 space-y-4">
                      <div className="w-16 h-16 rounded-2xl bg-slate-800/80 border border-slate-700 flex items-center justify-center mx-auto text-amber-400">
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                      </div>
                      <h3 className="text-base font-semibold text-slate-200">
                        {mode === 'parameter' 
                          ? 'พร้อมสร้างภาพสถาปัตยกรรมจากพารามิเตอร์' 
                          : 'อัปโหลดภาพสเก็ตช์ทางซ้ายมือเพื่อเริ่มต้น'}
                      </h3>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        เลือกประเภทอาคาร จำนวนชั้น และแนวทางการออกแบบจาก 100 สถาปนิกชื่อดังทางแถบด้านซ้าย จากนั้นกดปุ่ม <strong className="text-amber-400">"สร้างภาพเรนเดอร์"</strong> เพื่อดูผลลัพธ์
                      </p>
                    </div>
                  )}
                </div>

                {/* Bottom Footer Info */}
                <div className="pt-3 border-t border-slate-800/80 flex flex-wrap justify-between items-center text-[11px] text-slate-500 gap-2">
                  <span>ArchRender AI Studio • Single-File HTML Build</span>
                  <span>รองรับการอัปโหลดขึ้น GitHub Pages</span>
                </div>
              </div>

            </div>
          </main>

          {/* API Key Modal */}
          {showApiModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">ตั้งค่า Gemini API Key</h3>
                  <button onClick={() => setShowApiModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-slate-400 leading-relaxed">
                  ระบบจะบันทึก API Key ไว้ในเบราว์เซอร์ของคุณเท่านั้น (<code className="text-amber-400">localStorage</code>) ไม่มีการส่งคีย์ขึ้น GitHub ทำให้ปลอดภัยเมื่อเปิดใช้งานออนไลน์
                </p>
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1.5">Google Gemini API Key</label>
                  <input
                    type="password"
                    placeholder="AIzaSy..."
                    value={tempApiKey}
                    onChange={(e) => setTempApiKey(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowApiModal(false)}
                    className="px-4 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={handleSaveApiKey}
                    className="px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-slate-950 hover:bg-amber-400"
                  >
                    บันทึก API Key
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
